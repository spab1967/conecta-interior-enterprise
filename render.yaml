services:
  - type: web
    name: conecta-interior-enterprise
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: python -m gunicorn config.asgi:application -k uvicorn.workers.UvicornWorker --access-logfile - --error-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUDINARY_URL
        sync: false
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.14.3"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "False"
      - key: SECURE_HSTS_PRELOAD
        value: "False"
      - key: USE_X_FORWARDED_PROTO
        value: "True"
