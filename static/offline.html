<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <title>Sem conexão | ConectaInterior</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f6f9;
            color: #172033;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        main {
            width: min(100%, 440px);
            padding: 32px;
            border-radius: 24px;
            background: #fff;
            box-shadow: 0 16px 48px rgba(15, 23, 42, .12);
            text-align: center;
        }
        .symbol {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            display: grid;
            place-items: center;
            border-radius: 20px;
            background: linear-gradient(135deg, #22c55e, #0ea5e9);
            color: #fff;
            font-size: 38px;
            font-weight: 900;
        }
        h1 { margin: 0 0 12px; font-size: 1.65rem; }
        p { margin: 0 0 24px; color: #64748b; line-height: 1.55; }
        button {
            width: 100%;
            min-height: 48px;
            border: 0;
            border-radius: 12px;
            background: #0d6efd;
            color: #fff;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <main>
        <div class="symbol" aria-hidden="true">↔</div>
        <h1>Você está sem conexão</h1>
        <p>Verifique sua internet e tente novamente. Nenhum dado da sua conta ou pagamento foi armazenado neste aparelho.</p>
        <form method="get">
            <button type="submit">Tentar novamente</button>
        </form>
    </main>
</body>
</html>
