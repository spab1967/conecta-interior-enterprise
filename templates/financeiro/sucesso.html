{% extends "base.html" %}

{% block title %}
Pagamento confirmado | Conecta Interior
{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm border-0">

                <div class="card-body p-5 text-center">

                    <div class="display-4 mb-3">
                        ✓
                    </div>

                    <h1 class="h2 fw-bold">
                        Pagamento confirmado
                    </h1>

                    <p class="lead text-muted">
                        Seu pagamento foi aprovado e o novo plano
                        foi ativado.
                    </p>

                    <div class="d-grid gap-2 mt-4">

                        <a
                            href="{% url 'core:minha_conta' %}"
                            class="btn btn-primary btn-lg"
                        >
                            Ver Minha Conta
                        </a>

                        <a
                            href="{% url 'core:home' %}"
                            class="btn btn-outline-secondary"
                        >
                            Ir para o Conecta Interior
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
