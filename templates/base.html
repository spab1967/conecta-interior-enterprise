{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Conecta Interior
        {% endblock %}
    </title>

   <link rel="icon"
      type="image/png"
      href="{% static 'img/conecta-interior-logo.png' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/layout.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/cards.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/navbar.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/footer.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% include "includes/navbar.html" %}

    <main class="container py-4">

        {% block content %}
        {% endblock %}

    </main>

    {% include "includes/footer.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{% static 'js/app.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
