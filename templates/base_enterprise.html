{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}
        Conecta Interior Enterprise
        {% endblock %}
    </title>

    <link rel="icon"
          href="{% static 'img/favicon.ico' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{% static 'css/enterprise.css' %}">

    {% block extra_css %}
    {% endblock %}

</head>

<body class="enterprise-body">

    <div class="enterprise-app">

        <aside class="enterprise-sidebar-column">

            {% include "includes/sidebar_admin.html" %}

        </aside>

        <div class="enterprise-main">

            {% include "includes/topbar_admin.html" %}

            <main class="enterprise-content">

                {% block content %}
                {% endblock %}

            </main>

        </div>

    </div>

    <div class="enterprise-watermark"
         aria-hidden="true">

        <img src="{% static 'img/conecta-interior-logo.svg' %}"
             alt="">

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
